name: PR

on:
  pull_request: { }

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      - name: Golangci Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          args: --build-tags=goolm,stdjson

  vuln_check:
    name: Security Check
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=goolm,stdjson
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run Govulncheck
        run: govulncheck -C . -format text ./...

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      - name: Run go test
        run: go test -tags goolm,stdjson ./...

      - name: Run bedrock provider tests
        # Bedrock provider uses //go:build bedrock so the default test step
        # above excludes it (no AWS SDK types compile without the tag).
        # `make test-bedrock` is the canonical entry point.
        run: make test-bedrock

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    # The race detector only works on linux/amd64. It cannot run on
    # linux/arm64 (ThreadSanitizer: "unsupported VMA range"), which is
    # the architecture of Maple's own box - so this job is the ONLY
    # place the race detector can actually run for this repo.
    #
    # SCOPE: the packages that hold SHARED, MUTABLE state. Running
    # `-race` over ./... is slow and produces flaky failures from
    # timing-sensitive tests that are not about concurrency at all.
    # The registry is the one place where a genuine semantic race
    # lives (the allowlist + phase pair), so it is covered explicitly
    # by registry_race_semantics_test.go.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      - name: Run race detector (shared-state packages)
        run: go test -race -count=1 ./pkg/tools/... ./pkg/channels/...

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Docker-backed integration suites
        run: bash ./scripts/run-integration-tests.sh
